<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Porto Verde — an original open-world crime game for the Make GTA 6 bounty. Five missions, Verde PD, and a 6x6 procedural city.">
<title>Porto Verde — Make GTA 6</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c0e12; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #game { background: #20242a; display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 6, 10, 0.72); z-index: 10; }
  #overlay.hidden { display: none; }
  #panel { text-align: center; color: #fff; max-width: 640px; padding: 32px; }
  #overlay-title { font-size: 56px; letter-spacing: 6px; margin: 0 0 12px; color: #ffe600; text-shadow: 0 4px 0 #7a2e0e; }
  #overlay-text { font-size: 17px; line-height: 1.5; color: #ddd; margin: 0 0 28px; }
  .btn { display: inline-block; margin: 0 8px; padding: 14px 30px; font-size: 17px; font-weight: 700; color: #111; background: #ffe600; border: 0; border-radius: 8px; cursor: pointer; }
  .btn.secondary { background: #fff; }
  .btn:hover { filter: brightness(1.1); }
  .btn.hidden { display: none; }
  #foot { margin-top: 26px; font-size: 13px; color: #999; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="overlay">
  <div id="panel">
    <h1 id="overlay-title">PORTO VERDE</h1>
    <p id="overlay-text"></p>
    <button class="btn" id="btn-new">NEW GAME</button>
    <button class="btn secondary" id="btn-continue">CONTINUE</button>
    <button class="btn" id="btn-resume">RESUME</button>
    <div id="foot">WASD move · Shift run · Space jump · E car · F punch · Click shoot · R reload · P pause · M mute<br>An original open-world crime game. No network. Your save stays in this browser.</div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
