<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porto Verde — An Open-World Crime Story</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffb36b; font-family: sans-serif; }
  #game3d, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 12, 8, 0.72); color: #fff; text-align: center; z-index: 5; }
  .panel { max-width: 640px; padding: 32px; background: rgba(0,0,0,0.6); border: 2px solid #ffd23a; border-radius: 12px; }
  .panel h1 { margin: 0 0 8px; font-size: 52px; letter-spacing: 2px; color: #ffd23a; }
  .panel p { font-size: 16px; line-height: 1.5; }
  .panel button { margin: 8px; padding: 12px 28px; font-size: 18px; font-weight: bold; background: #ffd23a; color: #222; border: none; border-radius: 8px; cursor: pointer; }
  .panel button:hover { background: #ffe27a; }
  #pause { display: none; }
  #pause .panel h1 { font-size: 36px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game3d"></canvas>
<canvas id="hud"></canvas>
<div id="title" class="overlay">
  <div class="panel">
    <h1>PORTO VERDE</h1>
    <p id="title-text"></p>
    <button id="start-btn">NEW GAME</button>
    <button id="continue-btn">CONTINUE</button>
    <p style="font-size:13px;color:#ccc">Original city, story and characters. No Rockstar / GTA assets. Sound: M mute.</p>
  </div>
</div>
<div id="pause" class="overlay">
  <div class="panel"><h1>PAUSED</h1><p>Press P to keep playing. Progress saves automatically.</p></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
