<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porto Verde — An Open-World Crime Story</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: "Segoe UI", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud-top-left { position: absolute; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; }
  #hud-cash { font-size: 30px; font-weight: 800; color: #7ee787; text-shadow: 0 2px 6px rgba(0,0,0,0.8); letter-spacing: 1px; }
  #hud-stars { font-size: 22px; letter-spacing: 2px; }
  #hud-stars .star.on { color: #ffd34d; text-shadow: 0 0 8px rgba(255,211,77,0.8); }
  #hud-stars .star.off { color: rgba(255,255,255,0.25); }
  #hud-health { width: 180px; height: 18px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.35); border-radius: 9px; overflow: hidden; position: relative; }
  #hud-health-fill { height: 100%; width: 100%; background: #37d67a; transition: width 0.2s; }
  #hud-health-text { position: absolute; inset: 0; text-align: center; font-size: 12px; font-weight: 700; color: #fff; line-height: 18px; text-shadow: 0 1px 2px #000; }
  #hud-objective { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); max-width: 56vw; background: rgba(0,0,0,0.6); color: #ffe9a8; border: 1px solid rgba(255,211,77,0.4); border-radius: 8px; padding: 10px 16px; font-size: 15px; font-weight: 600; text-align: center; }
  #hud-minimap { position: absolute; top: 16px; right: 16px; width: 180px; height: 180px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,0.4); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  #hud-bottom-right { position: absolute; bottom: 20px; right: 20px; text-align: right; display: flex; flex-direction: column; gap: 4px; }
  #hud-speed { font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
  #hud-ammo { font-size: 16px; font-weight: 700; color: #ffe9a8; text-shadow: 0 1px 4px #000; }
  #hud-car { font-size: 14px; color: rgba(255,255,255,0.8); text-shadow: 0 1px 4px #000; }
  #hud-messages { position: absolute; bottom: 20px; left: 16px; display: flex; flex-direction: column-reverse; gap: 4px; max-width: 420px; }
  #hud-messages .msg { background: rgba(0,0,0,0.55); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 13px; border-left: 3px solid #ffd34d; }
  #hud-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; color: rgba(255,255,255,0.9); text-shadow: 0 0 4px #000; display: none; }
  #hud-vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,30,30,0.35) 100%); }
  #hud-damage { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s; background: radial-gradient(ellipse at center, transparent 45%, rgba(180,0,0,0.55) 100%); }
  #hud-controls { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.55); text-shadow: 0 1px 2px #000; white-space: nowrap; }
  #screen { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(5,8,12,0.72); backdrop-filter: blur(3px); }
  .panel { max-width: 640px; width: 92vw; background: linear-gradient(160deg, #101820, #0a0f16); border: 1px solid rgba(255,211,77,0.35); border-radius: 16px; padding: 36px 40px; text-align: center; color: #e8eef4; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .panel h1 { font-size: 52px; letter-spacing: 6px; color: #ffd34d; text-shadow: 0 0 24px rgba(255,211,77,0.35); margin-bottom: 6px; }
  .panel h1.busted { color: #5a8cff; }
  .panel h1.wasted { color: #e84040; }
  .panel .tagline { font-size: 14px; color: #9fb0c0; margin-bottom: 18px; }
  .panel .story { font-size: 15px; line-height: 1.6; color: #d5dee8; margin-bottom: 18px; }
  .panel .save-line { font-size: 13px; color: #7ee787; margin-bottom: 14px; }
  .menu-row { display: flex; gap: 12px; justify-content: center; margin: 8px 0 18px; }
  .menu-btn { pointer-events: auto; cursor: pointer; font-size: 17px; font-weight: 800; letter-spacing: 2px; padding: 13px 28px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: #1a2430; color: #e8eef4; transition: transform 0.1s, background 0.15s; }
  .menu-btn:hover { transform: translateY(-2px); background: #243244; }
  .menu-btn.primary { background: #ffd34d; color: #14100a; border-color: #ffd34d; }
  .menu-btn.primary:hover { background: #ffe08a; }
  .panel .hint { font-size: 12px; color: #7d8b9a; line-height: 1.7; }
  .panel .hint.small { margin-top: 6px; font-size: 11px; color: #5a6a7a; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="screen"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }

<script type="module" src="./src/main.js"></script>
</body>
</html>
